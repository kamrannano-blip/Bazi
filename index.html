<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🔴 Crazy Ball | توپ دیوانه</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-item">
        <span class="label">امتیاز</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">سرعت</span>
        <span id="speed">1x</span>
      </div>
      <div class="hud-item">
        <span class="label">رکورد</span>
        <span id="highScore">0</span>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
      <h1 class="title">🔴 CRAZY BALL</h1>
      <p class="subtitle">توپ دیوانه</p>
      <p class="description">
        با لمس صفحه، توپ رو بپرون<br/>
        از موانع رد شو و تا می‌تونی زنده بمون<br/>
        <b>سرعت هر لحظه بیشتر می‌شه!</b>
      </p>
      <button id="startBtn" class="btn">شروع بازی</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1 class="title gameover">💥 بوم!</h1>
      <div class="stats">
        <p>امتیاز: <span id="finalScore">0</span></p>
        <p>رکورد: <span id="finalHighScore">0</span></p>
        <p>سرعت نهایی: <span id="finalSpeed">1x</span></p>
      </div>
      <button id="restartBtn" class="btn">دوباره تلاش کن</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
