<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>⭐ Stardust | غبار ستاره‌ای</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-item">
        <span class="label">امتیاز</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">رکورد</span>
        <span id="highScore">0</span>
      </div>
      <div class="hud-item">
        <span class="label">مرحله</span>
        <span id="level">1</span>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
      <h1 class="title">⭐ STARDUST</h1>
      <p class="subtitle">غبار ستاره‌ای</p>
      <p class="description">
        با انگشتت ستاره رو هدایت کن، غبار کیهانی جمع کن<br/>
        و از سیاهچاله‌ها فرار کن...
      </p>
      <button id="startBtn" class="btn">شروع بازی</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1 class="title gameover">💫 پایان سفر</h1>
      <div class="stats">
        <p>امتیاز نهایی: <span id="finalScore">0</span></p>
        <p>رکورد: <span id="finalHighScore">0</span></p>
        <p>مرحله: <span id="finalLevel">1</span></p>
      </div>
      <button id="restartBtn" class="btn">دوباره تلاش کن</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
